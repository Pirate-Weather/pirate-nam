# Tile cache and limits in front of the WMS. Only the WMS path is public; the rest of xpublish's API stays private.
proxy_cache_path /var/cache/nginx/wms levels=1:2 keys_zone=wms:20m max_size=10g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=wms_rate:10m rate=40r/s;
# A very large image is slow to draw and would be an easy way to tie up the server.
map $arg_width  $bad_width  { default 1; "" 0; "~^([0-9]{1,3}|1[0-9]{3}|20[0-3][0-9]|204[0-8])$" 0; }
map $arg_height $bad_height { default 1; "" 0; "~^([0-9]{1,3}|1[0-9]{3}|20[0-3][0-9]|204[0-8])$" 0; }
server {
    listen 80;
    server_name nam-wms.pirateweather.net;
    location = /datasets/pirate-nam/wms {
        limit_except GET HEAD { deny all; }
        if ($bad_width)  { return 400; }
        if ($bad_height) { return 400; }
        limit_req zone=wms_rate burst=200 nodelay;
        proxy_pass http://127.0.0.1:8974;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_cache wms;
        proxy_cache_key $scheme$host$request_uri;  # Capabilities documents contain the hostname.
        proxy_cache_valid 200 6h;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin * always;
    }
    location = / { return 302 https://pirate-nam-tor.s3.ca-east-tor.io.cloud.ovh.net/data.html; }  # A browser landing here gets the page that explains the service.
    location / { return 404; }
}
