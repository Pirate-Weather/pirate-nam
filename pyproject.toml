[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-woof-nam"
version = "0.1.1"
description = "GPU port of the NOAA/NCEP NAM (NMMB dynamics + NAM physics) 12 km CONUS parent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Recast Systems" }]
dependencies = [
    "cupy-cuda13x[ctk]",   # [ctk]: the CUDA headers NVRTC needs to compile the kernels
    "numpy",
    "scipy",
    "netCDF4",
    "Pillow",
    "gpuwm>=2.9.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.scripts]
woof-nam = "namgpu.cli:main"

[tool.setuptools.packages.find]
include = ["namgpu*"]

# Everything a run reads ships in the wheel: kernels, tables and NOAA fix files (data/), the NAM parm
# files (parm/), the unit list (UNITS.json) and the reused ArWen files (third_party/).
[tool.setuptools.package-data]
namgpu = ["kernels/*.cu", "kernels/*.cuh", "data/**/*", "data/*", "parm/*", "products/*.tsv", "UNITS.json", "third_party/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
