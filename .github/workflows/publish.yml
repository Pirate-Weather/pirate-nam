name: publish

# Builds woof-nam (wheel + sdist), attaches them with SHA256SUMS to the release,
# and (only when enabled, see THE PUBLISH SWITCH) uploads them to pypi.org.
#
# Triggers: a published GitHub release (tag vX.Y.Z), or workflow_dispatch with a
# version input (X.Y.Z, must equal pyproject's version; builds the selected ref).
# Nothing fires on a push or on a tag alone.
#
# PyPI trusted publisher binding (OIDC, no API token or secret is read):
#   recastsystems / woof-nam / publish.yml / pypi
# Renaming this file, or renaming or dropping the `pypi` environment, breaks it.
#
# THE PUBLISH SWITCH: PyPI upload enabled only on Drew's yes.
# The publish job runs only when the repository variable WOOF_NAM_PYPI is "true"
# (Settings > Secrets and variables > Actions > Variables). Unset, this workflow
# builds, tests and attaches the files to the GitHub release, and the publish job
# is skipped. Setting the variable also needs the `pypi` environment and the PyPI
# pending publisher above.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, for example 0.1.0 (must match pyproject.toml)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-woof-nam-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: version matches pyproject
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            case "$TAG" in v[0-9]*) ;; *) echo "tag $TAG is not vX.Y.Z"; exit 1 ;; esac
            WANT="${TAG#v}"
          else
            WANT="$INPUT"
          fi
          HAVE=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "$WANT" = "$HAVE" ] || { echo "requested $WANT but pyproject.toml says $HAVE"; exit 1; }
          echo "version=$HAVE" >> "$GITHUB_OUTPUT"

      - name: licence check
        run: python tools/licence_check.py

      - name: CPU import smoke (source tree)
        run: |
          python -m pip install --quiet numpy
          PYTHONPATH=. python -c "import namgpu, namgpu.config, namgpu.grid; print('import ok', namgpu.__file__)"
          python tests/test_cli.py

      - name: build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build
          ls -l dist

      - name: CPU import smoke (built wheel)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet numpy
          /tmp/smoke/bin/pip install --quiet --no-deps dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import namgpu, namgpu.config, namgpu.grid; print('wheel import ok', namgpu.__file__)"
          # the wheel alone: the woof-nam command, its package data and the licence notices, no checkout on the path
          cp "$GITHUB_WORKSPACE/tests/test_cli.py" /tmp/test_cli_wheel.py
          cd /tmp && WOOF_NAM_TEST_INSTALLED=1 /tmp/smoke/bin/python /tmp/test_cli_wheel.py
          cd /tmp && /tmp/smoke/bin/woof-nam --help && /tmp/smoke/bin/woof-nam licence-check

      - name: SHA256SUMS
        run: cd dist && sha256sum * | tee ../SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  attach:
    # Attaches the built files to the release vX.Y.Z (if that release exists).
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/* SHA256SUMS
          else
            echo "::warning::no release $TAG; files are in the run's dist artifact only"
          fi

  publish:
    # PyPI upload enabled only on Drew's yes: skipped unless vars.WOOF_NAM_PYPI == 'true'.
    if: vars.WOOF_NAM_PYPI == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: check files against SHA256SUMS
        run: cd dist && sha256sum -c ../SHA256SUMS --strict
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
